<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Поиск стран</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app">
      <h1>Поиск стран</h1>
      
      <div class="search-box">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Начните вводить название страны..." 
          autocomplete="off" 
        />
      </div>

      <!-- Контейнер для статусов: загрузка, пусто, ошибка -->
      <div id="status-container" class="status-container hidden"></div>

      <!-- Контейнер для карточек -->
      <div id="results-container" class="results-grid"></div>
    </div>

    <!-- Модальное окно для деталей -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-content">
        <button id="modal-close" class="modal-close" aria-label="Закрыть">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
